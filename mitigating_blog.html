<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cross Reason — Judge Accuracy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --border: #e4e0db;
      --border-light: #efecea;
      --text: #2c2c2c;
      --text-muted: #7a7672;
      --text-dim: #a8a29e;
      --teal: #66c2a5;
      --peach: #f4b683;
      --purple: #b8a9d4;
      --grid: #e8e4df;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper { max-width: 780px; margin: 0 auto; padding: 0; }

    .toggle-wrap { display: flex; justify-content: center; padding: 1.25rem 0 1rem; }
    .toggle {
      display: flex; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .toggle button {
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500;
      padding: 0.55rem 1.25rem; border: none; background: transparent;
      color: var(--text-muted); cursor: pointer; transition: all 0.25s ease;
    }
    .toggle button:not(:last-child) { border-right: 1px solid var(--border); }
    .toggle button.active { background: var(--text); color: #fff; }
    .toggle button:not(.active):hover { background: var(--border-light); color: var(--text); }

    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.25rem 1.25rem 0.75rem; overflow: hidden;
    }

    .legend { display: flex; justify-content: center; gap: 1.25rem; margin-bottom: 1.25rem; }
    .legend-item {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.76rem; font-weight: 500; color: var(--text-muted);
      cursor: default; padding: 0.25rem 0.5rem; border-radius: 6px;
      transition: opacity 0.2s ease;
    }
    .legend-item.dimmed { opacity: 0.2; }
    .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    .legend-swatch.teal   { background: var(--teal); }
    .legend-swatch.peach  { background: var(--peach); }
    .legend-swatch.purple { background: var(--purple); }

    .chart-area { display: flex; height: 280px; position: relative; }
    .y-axis {
      display: flex; flex-direction: column; justify-content: space-between;
      height: 100%; padding-right: 0.5rem; width: 34px; flex-shrink: 0;
    }
    .y-axis span {
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
      color: var(--text-dim); text-align: right;
    }
    .y-label {
      position: absolute; left: -6px; top: 50%;
      transform: rotate(-90deg) translateX(-50%); transform-origin: left center;
      font-size: 0.68rem; font-weight: 500; color: var(--text-muted);
      letter-spacing: 0.02em; white-space: nowrap;
    }
    .chart-inner { flex: 1; height: 100%; position: relative; overflow: hidden; }
    .grid {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: space-between; pointer-events: none;
    }
    .grid .line { height: 1px; background: var(--grid); }
    .grid .line:last-child { background: var(--border); }

    .model-groups {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: flex-end; justify-content: space-around; padding: 0 0.25rem;
    }
    .model-group {
      display: flex; flex-direction: column; align-items: center;
      flex: 1; height: 100%; justify-content: flex-end; min-width: 0;
    }
    .bars-row { display: flex; align-items: flex-end; gap: 3px; justify-content: center; }
    .bar {
      width: 28px; border-radius: 3px 3px 0 0;
      transition: height 0.6s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s ease, filter 0.2s ease;
      cursor: default; position: relative;
    }
    .bar:hover { filter: brightness(1.08); }
    .bar::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 50%);
      pointer-events: none;
    }
    .bar.teal   { background: var(--teal); }
    .bar.peach  { background: var(--peach); }
    .bar.purple { background: var(--purple); }
    .bar.dimmed { opacity: 0.12; }

    .x-labels {
      display: flex; justify-content: space-around;
      padding: 0.5rem 0.25rem 0; margin-left: 34px;
    }
    .x-label {
      flex: 1; text-align: center; font-size: 0.62rem; font-weight: 500;
      color: var(--text-muted); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; min-width: 0; padding: 0 2px;
    }

    .note {
      text-align: center; font-size: 0.72rem; color: var(--text-muted);
      margin-top: 0.85rem; padding-top: 0.7rem;
      border-top: 1px solid var(--border-light); font-style: italic; padding-bottom: 0.25rem;
    }

    @media (max-width: 550px) {
      .chart-card { padding: 1rem 0.75rem 0.5rem; }
      .chart-area { height: 220px; }
      .bar { width: 20px; }
      .bars-row { gap: 2px; }
      .legend { gap: 0.5rem; flex-wrap: wrap; }
      .x-label { font-size: 0.52rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="toggle-wrap">
    <div class="toggle">
      <button class="active" data-mode="harmful">Harmful Self-Pref</button>
      <button data-mode="legitimate">Legitimate Self-Pref</button>
    </div>
  </div>
  <div class="chart-card">
    <div class="legend" id="legend"></div>
    <div class="chart-area">
      <span class="y-label">Judge-Accuracy (%)</span>
      <div class="y-axis">
        <span>100</span><span>80</span><span>60</span><span>40</span><span>20</span><span>0</span>
      </div>
      <div class="chart-inner">
        <div class="grid">
          <div class="line"></div><div class="line"></div><div class="line"></div>
          <div class="line"></div><div class="line"></div><div class="line"></div>
        </div>
        <div class="model-groups" id="models"></div>
      </div>
    </div>
    <div class="x-labels" id="xlabels"></div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const MODELS = [
  'Llama-3.1-8B','Qwen2.5-7B','Llama-4-Scout-17B','Llama-4-Maverick-17B','DeepSeek-V3-37B'
];
const HARMFUL = {
  'Llama-3.1-8B':         [41.6, 20.4, 0.0],
  'Qwen2.5-7B':           [64.0, 31.4, 0.0],
  'Llama-4-Scout-17B':    [57.4, 69.9, 78.1],
  'Llama-4-Maverick-17B': [64.6, 79.5, 83.9],
  'DeepSeek-V3-37B':      [52.8, 63.6, 73.8],
};
const LEGITIMATE = {
  'Llama-3.1-8B':         [10.3, 42.8, 0.0],
  'Qwen2.5-7B':           [39.1, 56.7, 0.0],
  'Llama-4-Scout-17B':    [79.3, 48.5, 45.3],
  'Llama-4-Maverick-17B': [90.4, 59.5, 54.1],
  'DeepSeek-V3-37B':      [91.7, 68.1, 61.3],
};
const SERIES = {
  harmful:    ['Original', 'Cross reason', 'Cross reason Strong'],
  legitimate: ['Original', 'Cross reason', 'Cross reason Weaker'],
};
const COLORS = ['teal', 'peach', 'purple'];
const NOTES = {
  harmful:    "Note: The Judge's original selection was wrong.",
  legitimate: "Note: The Judge's original selection was right.",
};

let mode = 'harmful';
let highlightSeries = null;
const modelsEl = document.getElementById('models');
const legendEl = document.getElementById('legend');
const noteEl = document.getElementById('note');
const xlabelsEl = document.getElementById('xlabels');

function render() {
  const data = mode === 'harmful' ? HARMFUL : LEGITIMATE;
  const series = SERIES[mode];

  legendEl.innerHTML = '';
  series.forEach((name, si) => {
    const item = document.createElement('div');
    item.className = 'legend-item' + (highlightSeries !== null && highlightSeries !== si ? ' dimmed' : '');
    item.innerHTML = `<span class="legend-swatch ${COLORS[si]}"></span>${name}`;
    item.addEventListener('mouseenter', () => { highlightSeries = si; updateHighlight(); });
    item.addEventListener('mouseleave', () => { highlightSeries = null; updateHighlight(); });
    legendEl.appendChild(item);
  });

  xlabelsEl.innerHTML = '';
  MODELS.forEach(model => {
    const lbl = document.createElement('div');
    lbl.className = 'x-label';
    lbl.textContent = model;
    xlabelsEl.appendChild(lbl);
  });

  modelsEl.innerHTML = '';
  MODELS.forEach((model, mi) => {
    const vals = data[model];
    const group = document.createElement('div');
    group.className = 'model-group';
    const row = document.createElement('div');
    row.className = 'bars-row';

    vals.forEach((v, si) => {
      const bar = document.createElement('div');
      bar.className = `bar ${COLORS[si]}` + (highlightSeries !== null && highlightSeries !== si ? ' dimmed' : '');
      bar.dataset.series = si;
      bar.style.height = '0px';
      bar.addEventListener('mouseenter', () => { highlightSeries = si; updateHighlight(); });
      bar.addEventListener('mouseleave', () => { highlightSeries = null; updateHighlight(); });
      row.appendChild(bar);

      requestAnimationFrame(() => {
        setTimeout(() => {
          const maxH = modelsEl.clientHeight - 4;
          bar.style.height = Math.max((v / 100) * maxH, 2) + 'px';
        }, si * 60 + mi * 40);
      });
    });

    group.appendChild(row);
    modelsEl.appendChild(group);
  });

  noteEl.textContent = NOTES[mode];
}

function updateHighlight() {
  document.querySelectorAll('.bar').forEach(bar => {
    const si = parseInt(bar.dataset.series);
    bar.classList.toggle('dimmed', highlightSeries !== null && highlightSeries !== si);
  });
  document.querySelectorAll('.legend-item').forEach((item, si) => {
    item.classList.toggle('dimmed', highlightSeries !== null && highlightSeries !== si);
  });
}

document.querySelector('.toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.classList.contains('active')) return;
  document.querySelectorAll('.toggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mode = btn.dataset.mode;
  highlightSeries = null;
  render();
});

render();
</script>
</body>
</html>
